module: [crypto, node:crypto]
rules:
  - id: node-keygen
    functions: [generateKeyPair, generateKeyPairSync]
    category: keygen
    algorithmFrom: { arg: 0 }
    values:
      rsa: { algorithm: RSA, status: vulnerable, note: "Classical public-key cryptography is vulnerable to Shor's algorithm." }
      rsa-pss: { algorithm: RSA-PSS, status: vulnerable, note: "Classical public-key cryptography is vulnerable to Shor's algorithm." }
      ec: { algorithm: EC, status: vulnerable, note: "Classical public-key cryptography is vulnerable to Shor's algorithm." }
      ed25519: { algorithm: Ed25519, status: vulnerable, note: "Classical public-key cryptography is vulnerable to Shor's algorithm." }
      x25519: { algorithm: X25519, status: vulnerable, note: "Classical public-key cryptography is vulnerable to Shor's algorithm." }
      dh: { algorithm: DH, status: vulnerable, note: "Classical public-key cryptography is vulnerable to Shor's algorithm." }
      ml-kem-512: { algorithm: ML-KEM-512, status: observed-resistant }
      ml-kem-768: { algorithm: ML-KEM-768, status: observed-resistant }
      ml-kem-1024: { algorithm: ML-KEM-1024, status: observed-resistant }
      ml-dsa-44: { algorithm: ML-DSA-44, status: observed-resistant }
      ml-dsa-65: { algorithm: ML-DSA-65, status: observed-resistant }
      ml-dsa-87: { algorithm: ML-DSA-87, status: observed-resistant }
  - id: node-rsa-encrypt
    functions: [publicEncrypt, privateDecrypt]
    category: encryption
    algorithm: RSA
    status: vulnerable
  - id: node-key-exchange
    functions: [createECDH, createDiffieHellman, createDiffieHellmanGroup, getDiffieHellman]
    category: key-exchange
    algorithm: ECDH/DH
    status: vulnerable
  - id: node-signature
    functions: [createSign, createVerify]
    category: signature
    algorithmFrom: { arg: 0 }
    values:
      rsa-sha256: { algorithm: RSA, status: vulnerable }
      rsa-sha384: { algorithm: RSA, status: vulnerable }
      rsa-sha512: { algorithm: RSA, status: vulnerable }
      sha256: { algorithm: RSA, status: vulnerable, note: "Node createSign requires an asymmetric key; key type needs review." }
  - id: node-cipher
    functions: [createCipheriv, createDecipheriv]
    category: symmetric
    algorithmFrom: { arg: 0 }
    values:
      aes-256-gcm: { algorithm: AES-256-GCM, status: observed-resistant }
      aes-128-gcm: { algorithm: AES-128-GCM, status: unresolved, note: "AES-128 has reduced quantum security margin; review migration policy." }
  - id: node-hash
    functions: [createHash]
    category: hash
    algorithmFrom: { arg: 0 }
    values:
      sha256: { algorithm: SHA-256, status: observed-resistant }
      sha384: { algorithm: SHA-384, status: observed-resistant }
      sha512: { algorithm: SHA-512, status: observed-resistant }
