# The openssl crate (github.com/sfackler/rust-openssl), Rust's interface to OpenSSL. Names are paths from the crate:
# digests (`MessageDigest::sha256()`, `Md::sha256()`, `openssl::sha::sha256`), ciphers (`Cipher::aes_256_gcm()`), and key
# types by module (`openssl::rsa`, `openssl::ec`) or by `pkey::Id`. A digest chosen by name is read from the string.
module: [openssl]
rules:
  - id: openssl-rs-md5
    functions: []
    names: [openssl::hash::MessageDigest::md5, openssl::md::Md::md5]
    category: hash
    algorithm: MD5
    status: needs-review
    note: "Classically weak; migrate regardless of quantum risk."
  - id: openssl-rs-sha1
    functions: []
    names: [openssl::hash::MessageDigest::sha1, openssl::md::Md::sha1, openssl::sha::sha1, openssl::sha::Sha1]
    category: hash
    algorithm: SHA-1
    status: needs-review
    note: "Classically weak; migrate regardless of quantum risk."
  - id: openssl-rs-sha224
    functions: []
    names: [openssl::hash::MessageDigest::sha224, openssl::md::Md::sha224, openssl::sha::sha224, openssl::sha::Sha224]
    category: hash
    algorithm: SHA-224
    status: needs-review
    note: "112-bit collision strength; review against your policy."
  - id: openssl-rs-sha256
    functions: []
    names: [openssl::hash::MessageDigest::sha256, openssl::md::Md::sha256, openssl::sha::sha256, openssl::sha::Sha256]
    category: hash
    algorithm: SHA-256
    status: observed-resistant
