    category: hash
    algorithm: SHA-512
    status: observed-resistant
  - id: ring-sha512-256
    functions: []
    names: [ring::digest::SHA512_256]
    category: hash
    algorithm: SHA-512/256
    status: observed-resistant
  - id: ring-sha1
    functions: []
    names: [ring::digest::SHA1_FOR_LEGACY_USE_ONLY]
    category: hash
    algorithm: SHA-1
    status: needs-review
    note: "Classically weak; migrate regardless of quantum risk."
  - id: aws-lc-rs-sha224
    functions: []
    names: [aws_lc_rs::digest::SHA224]
    category: hash
    algorithm: SHA-224
    status: needs-review
    note: "112-bit collision strength; review against your policy."
