# ring, and aws-lc-rs, which copies ring's interface. Names are written once for ring: `aws_lc_rs::digest::SHA256` is read
# as `ring::digest::SHA256` (see `mirrors`). What only aws-lc-rs has (ML-KEM, ML-DSA, SHA-3, P-521, ...) is written with
# its own crate name. The algorithm is chosen by passing one of these constants, such as `&digest::SHA256`.
module: [ring, aws_lc_rs]
mirrors: { aws_lc_rs: ring }
rules:
  - id: ring-sha256
    functions: []
    names: [ring::digest::SHA256]
    category: hash
    algorithm: SHA-256
    status: observed-resistant
  - id: ring-sha384
    functions: []
    names: [ring::digest::SHA384]
    category: hash
    algorithm: SHA-384
    status: observed-resistant
  - id: ring-sha512
