# RustCrypto crates (github.com/RustCrypto), plus the dalek crates for Ed25519 and X25519. Names are paths from the
# crate root, as written in Rust with underscores (the md-5 crate is `md5`). A name covers every path below it, so a crate
# that holds a single algorithm is listed by its root (`rsa` covers `rsa::RsaPrivateKey` and `rsa::pkcs1v15::SigningKey`).
# HMAC, HKDF and PBKDF2 take the hash as a type argument (`Hmac<Sha256>`), which is reported on its own.
module: [sha1, sha2, sha3, md5, md4, blake2, ripemd, aes, aes_gcm, aes_gcm_siv, chacha20poly1305, chacha20, des, rc4, rsa, dsa, ecdsa, p256, p384, p521, k256, sm2, ed25519, ed25519_dalek, x25519_dalek, ed448, ed448_goldilocks, x448, ml_kem, ml_dsa, slh_dsa, x_wing, argon2, scrypt]
rules:
  - id: rustcrypto-sha256
    functions: []
    names: [sha2::Sha256]
    category: hash
    algorithm: SHA-256
    status: observed-resistant
  - id: rustcrypto-sha384
    functions: []
    names: [sha2::Sha384]
    category: hash
    algorithm: SHA-384
    status: observed-resistant
  - id: rustcrypto-sha512
    functions: []
    names: [sha2::Sha512]
    category: hash
    algorithm: SHA-512
    status: observed-resistant
  - id: rustcrypto-sha512-256
    functions: []
    names: [sha2::Sha512_256]
    category: hash
    algorithm: SHA-512/256
    status: observed-resistant
  - id: rustcrypto-sha224
    functions: []
    names: [sha2::Sha224, sha2::Sha512_224]
    category: hash
    algorithm: SHA-224
    status: needs-review
    note: "112-bit collision strength; review against your policy."
  - id: rustcrypto-sha3-256
    functions: []
    names: [sha3::Sha3_256]
    category: hash
    algorithm: SHA3-256
    status: observed-resistant
  - id: rustcrypto-sha3-384
    functions: []
    names: [sha3::Sha3_384]
    category: hash
    algorithm: SHA3-384
    status: observed-resistant
  - id: rustcrypto-sha3-512
    functions: []
    names: [sha3::Sha3_512]
    category: hash
    algorithm: SHA3-512
    status: observed-resistant
  - id: rustcrypto-sha3-224
    functions: []
    names: [sha3::Sha3_224]
    category: hash
    algorithm: SHA3-224
    status: needs-review
    note: "112-bit collision strength; review against your policy."
  - id: rustcrypto-keccak256
    functions: []
    names: [sha3::Keccak256, sha3::Keccak384, sha3::Keccak512]
    category: hash
    algorithm: Keccak
    status: observed-resistant
    note: "The original Keccak, which differs from SHA-3 only in padding (used by Ethereum)."
  - id: rustcrypto-keccak224
    functions: []
    names: [sha3::Keccak224]
    category: hash
    algorithm: Keccak-224
    status: needs-review
    note: "112-bit collision strength; review against your policy."
  - id: rustcrypto-shake256
    functions: []
    names: [sha3::Shake256]
    category: hash
    algorithm: SHAKE256
    status: observed-resistant
  - id: rustcrypto-shake128
    functions: []
    names: [sha3::Shake128]
    category: hash
    algorithm: SHAKE128
    status: needs-review
    note: "128-bit security level; a quantum computer reduces its margin. Review migration policy."
  - id: rustcrypto-sha1
    functions: []
    names: [sha1]
    category: hash
    algorithm: SHA-1
    status: needs-review
    note: "Classically weak; migrate regardless of quantum risk."
  - id: rustcrypto-md5
    functions: []
    names: [md5]
    category: hash
    algorithm: MD5
    status: needs-review
    note: "Classically weak; migrate regardless of quantum risk."
  - id: rustcrypto-md4
    functions: []
    names: [md4]
    category: hash
    algorithm: MD4
    status: needs-review
    note: "Broken even against ordinary computers; replace."
  - id: rustcrypto-ripemd160
    functions: []
    names: [ripemd::Ripemd160]
    category: hash
    algorithm: RIPEMD-160
    status: needs-review
    note: "An old 160-bit hash; replace with SHA-256 or stronger."
  - id: rustcrypto-blake2b
    functions: []
    names: [blake2::Blake2b, blake2::Blake2b512, blake2::Blake2bVar, blake2::Blake2bMac, blake2::Blake2bMac512]
