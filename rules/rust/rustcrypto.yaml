    functions: []
    names: [aes_gcm::AesGcm]
    category: symmetric
    algorithm: AES-GCM
    status: unresolved
    note: "The AES key size is the first type argument (AesGcm<Aes256, ...>); 128-bit needs review, 192 and 256 are fine."
