      "slh-dsa-shake-128f": { algorithm: SLH-DSA-SHAKE-128f, status: observed-resistant }
      "slh-dsa-shake-192s": { algorithm: SLH-DSA-SHAKE-192s, status: observed-resistant }
      "slh-dsa-shake-192f": { algorithm: SLH-DSA-SHAKE-192f, status: observed-resistant }
      "slh-dsa-shake-256s": { algorithm: SLH-DSA-SHAKE-256s, status: observed-resistant }
      "slh-dsa-shake-256f": { algorithm: SLH-DSA-SHAKE-256f, status: observed-resistant }
  - id: openssl-pkey-ctx-name
    functions: [EVP_PKEY_CTX_new_from_name]
    category: keygen
    algorithmFrom: { arg: 1 }
    values: *pkey
  - id: openssl-pkey-quick-keygen
    functions: [EVP_PKEY_Q_keygen]
    category: keygen
    algorithmFrom: { arg: 2 }
    values: *pkey
  - id: openssl-ec-curve
    functions: [EC_KEY_new_by_curve_name, EC_GROUP_new_by_curve_name]
    category: keygen
    algorithm: EC
    status: vulnerable
    note: "Every curve these functions accept is a classical elliptic curve. A quantum computer could work out the private key from the public key (using Shor's algorithm). Plan to replace this key type."
