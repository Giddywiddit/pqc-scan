      "evp_pkey_sm2": { algorithm: SM2, status: vulnerable, note: "A quantum computer could work out the private key from the public key (using Shor's algorithm). Plan to replace this key type." }
      "evp_pkey_hmac": { algorithm: HMAC, status: unresolved, note: "Hash function is not resolved; review." }
      "evp_pkey_hkdf": { algorithm: HKDF, status: unresolved, note: "Hash function is not resolved; review." }
      "rsa": { algorithm: RSA, status: vulnerable, note: "A quantum computer could work out the private key from the public key (using Shor's algorithm). Plan to replace this key type." }
      "rsa-pss": { algorithm: RSA-PSS, status: vulnerable, note: "A quantum computer could work out the private key from the public key (using Shor's algorithm). Plan to replace this key type." }
