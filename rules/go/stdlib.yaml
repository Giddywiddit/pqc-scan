# Go's standard library (Go 1.27). Names are an import path and a member, as Go's documentation writes them
# (crypto/sha256.New). An import path alone covers every member of that package (crypto/rsa covers rsa.GenerateKey and
# *rsa.PrivateKey). HMAC, HKDF and PBKDF2 take the hash as an argument (hmac.New(sha256.New, key)), which is reported on
# its own. A crypto/tls.Config built in code ("functions") is reported where TLS is set up.
module: [crypto, crypto/sha256, crypto/sha512, crypto/sha3, crypto/sha1, crypto/md5, crypto/aes, crypto/des, crypto/rc4, crypto/rsa, crypto/dsa, crypto/ecdsa, crypto/ed25519, crypto/elliptic, crypto/ecdh, crypto/mlkem, crypto/mldsa, crypto/hpke, crypto/rand, crypto/tls, crypto/x509]
rules:
  - id: go-sha256
    functions: []
    names: [crypto/sha256.New, crypto/sha256.Sum256, crypto.SHA256]
    category: hash
    algorithm: SHA-256
    status: observed-resistant
  - id: go-sha224
    functions: []
    names: [crypto/sha256.New224, crypto/sha256.Sum224, crypto.SHA224]
    category: hash
    algorithm: SHA-224
    status: needs-review
    note: "112-bit collision strength; review against your policy."
  - id: go-sha384
    functions: []
    names: [crypto/sha512.New384, crypto/sha512.Sum384, crypto.SHA384]
    category: hash
    algorithm: SHA-384
    status: observed-resistant
