    status: observed-resistant
  - id: go-sha3-224
    functions: []
    names: [crypto/sha3.New224, crypto/sha3.Sum224, crypto.SHA3_224]
    category: hash
    algorithm: SHA3-224
    status: needs-review
    note: "112-bit collision strength; review against your policy."
  - id: go-shake256
    functions: []
    names: [crypto/sha3.NewSHAKE256, crypto/sha3.SumSHAKE256, crypto/sha3.NewCSHAKE256]
    category: hash
    algorithm: SHAKE256
    status: observed-resistant
  - id: go-shake128
    functions: []
    names: [crypto/sha3.NewSHAKE128, crypto/sha3.SumSHAKE128, crypto/sha3.NewCSHAKE128]
    category: hash
    algorithm: SHAKE128
    status: needs-review
    note: "128-bit security level; a quantum computer reduces its margin. Review migration policy."
  - id: go-sha1
    functions: []
    names: [crypto/sha1, crypto.SHA1]
    category: hash
    algorithm: SHA-1
    status: needs-review
    note: "Classically weak; migrate regardless of quantum risk."
  - id: go-md5
    functions: []
    names: [crypto/md5, crypto.MD5, crypto.MD5SHA1]
    category: hash
    algorithm: MD5
    status: needs-review
    note: "Classically weak; migrate regardless of quantum risk."
  - id: go-md4
    functions: []
    names: [crypto.MD4]
    category: hash
    algorithm: MD4
    status: needs-review
    note: "Broken even against ordinary computers; replace."
  - id: go-ripemd160
    functions: []
    names: [crypto.RIPEMD160]
    category: hash
    algorithm: RIPEMD-160
    status: needs-review
    note: "An old 160-bit hash; replace with SHA-256 or stronger."
  - id: go-aes
    functions: []
    names: [crypto/aes.NewCipher]
    category: symmetric
    algorithm: AES
    status: unresolved
    note: "The AES key size is the length of the key passed to aes.NewCipher: 128-bit needs review, 192 and 256 are fine."
  - id: go-des
    functions: []
    names: [crypto/des.NewCipher]
    category: symmetric
    algorithm: DES
    status: needs-review
    note: "Broken even against ordinary computers; replace."
  - id: go-3des
    functions: []
    names: [crypto/des.NewTripleDESCipher]
    category: symmetric
    algorithm: 3DES
    status: needs-review
    note: "Classically weak and deprecated; migrate."
  - id: go-rc4
    functions: []
    names: [crypto/rc4]
    category: symmetric
    algorithm: RC4
    status: needs-review
    note: "Broken even against ordinary computers; replace."
  - id: go-rsa
    functions: []
    names: [crypto/rsa, crypto/x509.ParsePKCS1PrivateKey, crypto/x509.ParsePKCS1PublicKey, crypto/x509.MarshalPKCS1PrivateKey, crypto/x509.MarshalPKCS1PublicKey, crypto/x509.RSA, crypto/x509.MD2WithRSA, crypto/x509.MD5WithRSA, crypto/x509.SHA1WithRSA, crypto/x509.SHA256WithRSA, crypto/x509.SHA384WithRSA, crypto/x509.SHA512WithRSA]
    category: keygen
    algorithm: RSA
    status: vulnerable
    note: "A quantum computer could work out the private key from the public key (using Shor's algorithm). Plan to replace this key type."
