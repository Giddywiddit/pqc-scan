module: [jws]
rules:
  - id: jws-sign
    functions: [sign, createSign]
    category: signature
    algorithmFrom: { arg: 0, property: header.alg }
    values:
      RS256: { algorithm: RSA, status: vulnerable, note: "Classical public-key signatures are vulnerable to Shor's algorithm." }
      RS384: { algorithm: RSA, status: vulnerable, note: "Classical public-key signatures are vulnerable to Shor's algorithm." }
      RS512: { algorithm: RSA, status: vulnerable, note: "Classical public-key signatures are vulnerable to Shor's algorithm." }
      PS256: { algorithm: RSA-PSS, status: vulnerable, note: "Classical public-key signatures are vulnerable to Shor's algorithm." }
      PS384: { algorithm: RSA-PSS, status: vulnerable, note: "Classical public-key signatures are vulnerable to Shor's algorithm." }
      PS512: { algorithm: RSA-PSS, status: vulnerable, note: "Classical public-key signatures are vulnerable to Shor's algorithm." }
      ES256: { algorithm: ECDSA, status: vulnerable, note: "Classical public-key signatures are vulnerable to Shor's algorithm." }
      ES384: { algorithm: ECDSA, status: vulnerable, note: "Classical public-key signatures are vulnerable to Shor's algorithm." }
      ES512: { algorithm: ECDSA, status: vulnerable, note: "Classical public-key signatures are vulnerable to Shor's algorithm." }
      ES256K: { algorithm: ECDSA, status: vulnerable, note: "Classical public-key signatures are vulnerable to Shor's algorithm." }
      EdDSA: { algorithm: EdDSA, status: vulnerable, note: "Classical public-key signatures are vulnerable to Shor's algorithm." }
      HS256: { algorithm: HMAC-SHA256, status: observed-resistant }
      HS384: { algorithm: HMAC-SHA384, status: observed-resistant }
      HS512: { algorithm: HMAC-SHA512, status: observed-resistant }
      none: { algorithm: none, status: unresolved, note: "Unsigned token; no cryptographic protection." }
  - id: jws-verify
    functions: [createVerify]
    category: signature
    algorithmFrom: { arg: 0, property: algorithm }
